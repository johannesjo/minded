<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>minded - dashboard simulation</title>
    <script>
      // In-memory chrome shim - must run before the module bundle imports
      // webextension-polyfill. Identical to the copy in index.html (keep in
      // sync). Gives the real data interface a working, session-persistent
      // backing store so the dashboard + interaction flow run off-extension.
      if (typeof globalThis.chrome === "undefined" || !globalThis.chrome.runtime) {
        const makeArea = () => {
          let data = {};
          const read = (keys) => {
            if (keys == null) return { ...data };
            if (typeof keys === "string")
              return keys in data ? { [keys]: data[keys] } : {};
            if (Array.isArray(keys)) {
              const out = {};
              keys.forEach((k) => {
                if (k in data) out[k] = data[k];
              });
              return out;
            }
            return { ...keys, ...data }; // object form: defaults overlaid by stored
          };
          const settle = (result, cb) => {
            if (typeof cb === "function") {
              cb(result);
              return undefined;
            }
            return Promise.resolve(result);
          };
          return {
            get: (keys, cb) => {
              if (typeof keys === "function") {
                cb = keys;
                keys = undefined;
              }
              return settle(read(keys), cb);
            },
            set: (items, cb) => {
              data = { ...data, ...items };
              return settle(undefined, cb);
            },
            remove: (keys, cb) => {
              (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete data[k]);
              return settle(undefined, cb);
            },
            clear: (cb) => {
              data = {};
              return settle(undefined, cb);
            },
          };
        };
        const settleMsg = (cb) =>
          typeof cb === "function"
            ? (cb(undefined), undefined)
            : Promise.resolve(undefined);
        globalThis.chrome = {
          runtime: {
            id: "styleguide-standalone",
            getURL: (p) => p,
            getManifest: () => ({}),
            sendMessage: (...args) => settleMsg(args[args.length - 1]),
            onMessage: { addListener: () => undefined, removeListener: () => undefined },
          },
          storage: { sync: makeArea(), local: makeArea() },
        };
      }
    </script>

    <!--
      Loading-screen sky - mirrors src/pages/newtab/index.html so the simulation
      boots with the same no-flash gradient the real app uses (plain base
      gradients: no stars, no day accents, no night afterglow). Keep light/dark
      in sync with isDarkModeNow() and --background-gradient.
    -->
    <style>
      /* OKLab where supported, today's sRGB elsewhere (_variables.scss). */
      @supports (background-image: linear-gradient(in oklab, red, blue)) {
        html {
          --sky-interpolation: in oklab;
        }
      }
      html {
        background: linear-gradient(
          to bottom var(--sky-interpolation,),
          #cfe4f5 0%,
          #cfe4f5 18%,
          #d8ecd6 36%,
          #f5efc8 54%,
          #f6dcd2 100%
        );
      }
      html.minded-loading-dark {
        background: linear-gradient(
          to bottom var(--sky-interpolation,),
          #02091f 0%,
          #041238 28%,
          #0a2860 68%,
          #123262 82%,
          #233053 92%,
          #2b3a63 100%
        );
      }
      body {
        margin: 0;
      }
      /* Unobtrusive dev-only escape hatch back to the styleguide index. */
      .sg-back {
        position: fixed;
        top: 8px;
        left: 10px;
        z-index: 2000;
        font:
          12px/1.2 system-ui,
          sans-serif;
        color: var(--c-fg, #333);
        opacity: 0.55;
        text-decoration: none;
      }
      .sg-back:hover {
        opacity: 1;
      }
    </style>
    <script>
      // Day/night loading sky - mirrors isDarkModeNow(), incl. the ?theme= dev
      // override (so forcing dark doesn't flash a light gradient before boot).
      var theme = new URLSearchParams(location.search).get("theme");
      var h = new Date().getHours();
      // The real sun's night windows, left by the app (src/shared/sky/skyNightCache.ts);
      // the fixed 19:00/06:00 clock when they're missing or stale.
      var t = Date.now();
      var night = h >= 19 || h < 6;
      try {
        var c = JSON.parse(localStorage.getItem("minded-sky-night") || "null");
        if (c && t >= c.from && t < c.to) {
          night = false;
          for (var i = 0; i < c.nights.length; i++) {
            if (t >= c.nights[i][0] && t < c.nights[i][1]) night = true;
          }
        }
      } catch (e) { /* no storage: keep the clock */ }
      var dark = theme === "dark" || (theme !== "light" && night);
      if (dark) {
        document.documentElement.className += " minded-loading-dark";
      }
    </script>
