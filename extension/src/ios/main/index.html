<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>minded - New Tab</title>

    <!--
      Loading-screen sky. Paints the app's background gradient on the document
      before the JS/CSS bundle loads, so booting no longer flashes a blank page.
      The root <html> background propagates to the whole viewport, so the opaque
      black on <body> below stays as a harmless fallback. Light/dark is chosen by
      clock (not OS theme) to match how the app itself decides - keep the rule in
      sync with isDarkModeNow() (src/shared/addWrapperClasses.ts) and the
      gradients with --background-gradient (src/styles/_variables.scss). Both
      stay the plain base gradient: like the stars, and like the day sky's
      bloom/veil/dome, the night's fading sunset afterglow (--night-afterglow)
      is a layer only the live sky has.
    -->
    <style>
      /* OKLab where supported, today's sRGB elsewhere (_variables.scss). */
      @supports (background-image: linear-gradient(in oklab, red, blue)) {
        html {
          --sky-interpolation: in oklab;
        }
      }
      html {
        /*
          A root background is sized to the <html> box, and before the bundle
          mounts that box is only the empty body's height (~16px). The sky
          then repeats down the screen as thin orange/turquoise stripes - not
          banding, which is why dithering never touched it. Stretch the box to
          the viewport so the gradient is painted once.
        */
        min-height: 100%;
        background: linear-gradient(
          to bottom var(--sky-interpolation,),
          #cfe4f5 0%,
          #cfe4f5 18%,
          #d8ecd6 36%,
          #f5efc8 54%,
          #f6dcd2 100%
        );
      }
      html.minded-loading-dark {
        background: linear-gradient(
          to bottom var(--sky-interpolation,),
          #02091f 0%,
          #041238 28%,
          #0a2860 68%,
          #123262 82%,
          #233053 92%,
          #2b3a63 100%
        );
      }
    </style>
    <script>
      // Runs synchronously in <head>, before first paint, so the gradient is
      // correct on the very first frame (no light->dark pop when the app mounts).
      var h = new Date().getHours();
      // The real sun's night windows, left by the app (src/shared/sky/skyNightCache.ts);
      // the fixed 19:00/06:00 clock when they're missing or stale.
      var t = Date.now();
      var night = h >= 19 || h < 6;
      try {
        var c = JSON.parse(localStorage.getItem("minded-sky-night") || "null");
        if (c && t >= c.from && t < c.to) {
          night = false;
          for (var i = 0; i < c.nights.length; i++) {
            if (t >= c.nights[i][0] && t < c.nights[i][1]) night = true;
          }
        }
      } catch (e) { /* no storage: keep the clock */ }
      if (night) {
        document.documentElement.className += " minded-loading-dark";
      }
    </script>
</head>

<!-- for the most weird unknown reasons the black background color is required for colors not to mess up -->
<body class="ios" style="background: #000; color: #fff">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="minded-6622"></div>

    <script src="indexMainIOS.tsx" type="module"></script>
</body>

</html>
